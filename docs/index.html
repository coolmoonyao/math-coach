<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>深圳中考数学辅导站</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root { --dash-bg:#3b82f6; --dash-bg-h:#2563eb; }
    .markdown-body { max-width: 980px; margin: 0 auto; }
    .markdown-body img { max-width: 100%; }
    /* 看板入口按钮 */
    .dash-links { margin: 14px 0 8px; }
    .dash-links .dash {
      display: inline-block; margin: 6px 10px 6px 0; padding: 10px 16px;
      background: var(--dash-bg); color: #fff; border-radius: 10px;
      text-decoration: none; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.15);
    }
    .dash-links .dash:hover { background: var(--dash-bg-h); }
    /* 侧栏看板分组小标 */
    .sidebar-dash-hint { color:#94a3b8; font-size:12px; padding:4px 0; }
  </style>
</head>
<body>
  <div id="app">文档加载中…若长时间停留，请确认网络可访问 cdn.jsdelivr.net</div>
  <script>
    window.$docsify = {
      name: '深圳中考数学辅导站',
      repo: 'coolmoonyao/math-coach',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      notFoundPage: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索文档…',
        noData: '找不到结果',
        depth: 4
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
